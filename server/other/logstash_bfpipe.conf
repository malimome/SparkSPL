input {
  beats {
    port => 5044
    #ssl => true
    #ssl_certificate_authorities => ["/home/user/crt/ca.crt"]
    #ssl_certificate => "/home/user/crt/server.crt"
    #ssl_key => "/home/user/crt/server.key"
    #ssl_verify_mode => "force_peer"
  }
}

