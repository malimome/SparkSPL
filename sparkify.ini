[uwsgi]
base=/var/www/sparkify
module = spl2spark_server
callable = app
plugins = python3
master = true
processes = 2
enable-threads = true
# The background session manager thread must start in each worker, not in the master.
lazy-apps = true
single-interpreter = true

socket = sparkify.sock
chmod-socket = 660
vacuum = true

die-on-term = true
logto = /var/log/uwsgi/sparkify.log

# Secrets and overrides live in an env file that is not part of the repository, e.g.
# SPARKIFY_API_KEYS, SPARKIFY_LIVY_PROXY_USER, SPARKIFY_DATA_DIR.
for-readline = /etc/sparkify/env
  env = %(_)
endfor =
